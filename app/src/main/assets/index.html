// Universal Player Object Normalizer (Maps Arabic & English fields, validates positions and stats)
function normalizePlayerObject(raw) {
  if (!raw || typeof raw !== 'object') return null;

  // Extract name
  const name = String(raw.name || raw['الاسم'] || raw['اللاعب'] || raw['اسم_اللاعب'] || raw['اسم'] || raw['player_name'] || 'لاعب سيرفر غير مسمى').trim();
  
  // Extract & normalize position
  let rawPos = String(raw.pos || raw.position || raw['المركز'] || raw['مركز'] || raw['الخانة'] || raw['خانة'] || 'ST').trim().toUpperCase();
  if (rawPos.includes('حارس') || rawPos === 'حارس مرمى') rawPos = 'GK';
  else if (rawPos.includes('مهاجم') || rawPos.includes('رأس حربة') || rawPos === 'هجوم') rawPos = 'ST';
  else if (rawPos.includes('صانع') || rawPos === 'صانع ألعاب') rawPos = 'CAM';
  else if (rawPos.includes('أيمن') && rawPos.includes('جناح')) rawPos = 'RW';
  else if (rawPos.includes('أيسر') && rawPos.includes('جناح')) rawPos = 'LW';
  else if (rawPos.includes('مدافع') || rawPos.includes('قلب')) rawPos = 'CB';
  else if (rawPos.includes('أيمن') && rawPos.includes('ظهير')) rawPos = 'RB';
  else if (rawPos.includes('أيسر') && rawPos.includes('ظهير')) rawPos = 'LB';
  else if (rawPos.includes('ارتكاز') || rawPos.includes('محور دفاعي')) rawPos = 'CDM';
  else if (rawPos.includes('وسط') || rawPos.includes('محور')) rawPos = 'CM';

  const validPositions = ['ST', 'RW', 'LW', 'CAM', 'CM', 'CDM', 'CB', 'LB', 'RB', 'GK'];
  const pos = validPositions.includes(rawPos) ? rawPos : 'ST';

  // Extract OVR and Age
  const ovr = Math.min(99, Math.max(50, parseInt(raw.ovr || raw.overall || raw.rating || raw['التقييم'] || raw['المستوى'] || raw['طاقة'] || raw['طاقات']) || 85));
  const age = Math.min(45, Math.max(15, parseInt(raw.age || raw['العمر'] || raw['السن']) || 24));

  // Extract attributes
  const pac = Math.min(99, Math.max(30, parseInt(raw.pac || raw.speed || raw.pace || raw['السرعة'] || raw['سرعة']) || (pos === 'GK' ? 60 : Math.min(99, ovr + (Math.random() > 0.5 ? 3 : -2)))));
  const sho = Math.min(99, Math.max(30, parseInt(raw.sho || raw.shooting || raw['التسديد'] || raw['تسديد'] || raw['قوة']) || (pos === 'CB' || pos === 'GK' ? 50 : Math.min(99, ovr + (Math.random() > 0.5 ? 2 : -3)))));
  const pas = Math.min(99, Math.max(30, parseInt(raw.pas || raw.passing || raw['التمرير'] || raw['تمرير'] || raw['صناعة']) || Math.min(99, ovr - 1)));
  const def = Math.min(99, Math.max(30, parseInt(raw.def || raw.defending || raw['الدفاع'] || raw['دفاع'] || raw['قطع']) || (pos === 'ST' || pos === 'LW' || pos === 'RW' ? 45 : Math.min(99, ovr))));

  // Extract Price & Wage
  const autoVal = Math.round(Math.pow(ovr / 50, 4) * 900000);
  const value = parseInt(raw.value || raw.price || raw['السعر'] || raw['القيمة'] || raw['مبلغ']) || autoVal;
  const wage = parseInt(raw.wage || raw.salary || raw['الراتب'] || raw['راتب']) || Math.max(5000, Math.round(value * 0.003));

  // Extract Edition & Tag
  let edition = String(raw.edition || raw.type || raw['البطاقة'] || raw['نوع_البطاقة'] || 'SERVER').toUpperCase();
  if (edition.includes('TOTW') || edition.includes('أسبوع')) edition = 'TOTW';
  else if (edition.includes('ICON') || edition.includes('أسطورة')) edition = 'ICON';
  else if (edition.includes('FUTURE') || edition.includes('مستقبل')) edition = 'FUTURE';
  else if (edition.includes('HOT') || edition.includes('صفقة')) edition = 'HOT_DEAL';
  else edition = 'SERVER';

  let editionTag = '🌐 بطاقة سيرفر';
  if (edition === 'TOTW') editionTag = '🌟 نجم الأسبوع (TOTW)';
  else if (edition === 'ICON') editionTag = '👑 أسطورة كروية (ICON)';
  else if (edition === 'FUTURE') editionTag = '🔥 موهبة المستقبل (FUTURE)';
  else if (edition === 'HOT_DEAL') editionTag = '⚡ صفقة مدوية (HOT DEAL)';

  const notes = String(raw.notes || raw.desc || raw.description || raw['ملاحظات'] || raw['الوصف'] || raw['وصف'] || 'تم تنزيله وتثبيته من السيرفر السحابي (متاح أوفلاين)').trim();
  const clubId = String(raw.clubId || raw.club || raw['النادي'] || raw['فريق'] || 'free_agent').trim();

  const cleanId = raw.id ? String(raw.id) : ('srv_' + encodeURIComponent(name.replace(/\s+/g, '_').toLowerCase()));

  return {
    id: cleanId,
    name,
    pos,
    ovr,
    age,
    pac,
    sho,
    pas,
    def,
    value,
    wage,
    clubId,
    edition,
    editionTag,
    notes,
    isDownloaded: true,
    downloadedAt: Date.now(),
    fitness: 100,
    morale: 95,
    contractYears: parseInt(raw.contractYears || raw['سنوات_العقد']) || 3,
    goals: 0,
    assists: 0,
    appearances: 0,
    cleanSheets: 0,
    minutes: 0,
    yellowCards: 0,
    redCards: 0,
    personality: raw.personality || 'ambitious'
  };
}

// Ensure downloaded players persist and are always present in the transfer market
function ensureDownloadedPlayersInMarket() {
  if (!Game) return;
  if (!Game.downloadedPlayers) Game.downloadedPlayers = [];
  if (!Game.transferMarket) Game.transferMarket = [];

  // Scrape any downloaded/server players currently in transferMarket and track them
  Game.transferMarket.forEach(p => {
    if (p.isDownloaded || (p.edition && p.edition !== 'normal') || (p.id && String(p.id).startsWith('srv_'))) {
      p.isDownloaded = true;
      if (!Game.downloadedPlayers.some(d => d.id === p.id || d.name === p.name)) {
        Game.downloadedPlayers.push(JSON.parse(JSON.stringify(p)));
      }
    }
  });

  // Re-inject any saved downloaded players into transferMarket if not in squad and not in market
  Game.downloadedPlayers.forEach(dp => {
    const inSquad = (Game.squad || []).some(s => s.id === dp.id || s.name === dp.name);
    if (!inSquad) {
      const inMarket = Game.transferMarket.some(m => m.id === dp.id || m.name === dp.name);
      if (!inMarket) {
        dp.isDownloaded = true;
        Game.transferMarket.unshift(JSON.parse(JSON.stringify(dp)));
      }
    }
  });
}
window.ensureDownloadedPlayersInMarket = ensureDownloadedPlayersInMarket;

// Convert Firebase / GitHub / Gist / RAW URLs to direct JSON endpoints
function resolveUniversalServerEndpoint(url) {
  if (!url || typeof url !== 'string') return '';
  url = url.trim();

  // Firebase Realtime Database: Automatically ensure .json extension for REST API queries
  // e.g. https://my-project-default-rtdb.firebaseio.com/players -> https://my-project-default-rtdb.firebaseio.com/players.json
  if (url.includes('firebaseio.com') && !url.includes('.json')) {
    const cleanUrl = url.split('?')[0].replace(/\/+$/, '');
    const query = url.includes('?') ? '?' + url.split('?')[1] : '';
    return `${cleanUrl}.json${query}`;
  }

  // GitHub Blob URL to Raw UserContent
  // e.g. https://github.com/user/repo/blob/main/players.json -> https://raw.githubusercontent.com/user/repo/main/players.json
  const githubBlobMatch = url.match(/^https:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/([^\/]+)\/(.+)$/);
  if (githubBlobMatch) {
    return `https://raw.githubusercontent.com/${githubBlobMatch[1]}/${githubBlobMatch[2]}/${githubBlobMatch[3]}/${githubBlobMatch[4]}`;
  }

  // GitHub Gist web URL to Raw or API
  // e.g. https://gist.github.com/username/123456789abc
  const gistMatch = url.match(/^https:\/\/gist\.github\.com\/([^\/]+)\/([a-zA-Z0-9]+)(\/.*)?$/);
  if (gistMatch && !url.includes('/raw')) {
    const gistId = gistMatch[2];
    return `https://api.github.com/gists/${gistId}`;
  }

  return url;
}

function applyDownloadedPlayersToMarket(weekTitle, fetchedPlayers, versionKey = null, syncSource = 'السيرفر السحابي (Firebase)', fingerprint = null) {
  ensureServerConfig();
  if (!Game.downloadedPlayers) Game.downloadedPlayers = [];
  if (!Game.transferMarket) Game.transferMarket = [];
  let newlyAddedCount = 0;

  fetchedPlayers.forEach(rawP => {
    const formattedPlayer = normalizePlayerObject(rawP);
    if (!formattedPlayer) return;
    formattedPlayer.isDownloaded = true;

    // Check if player is already in squad
    const inSquad = (Game.squad || []).some(s => s.id === formattedPlayer.id || s.name === formattedPlayer.name);
    if (inSquad) return;

    // Save to downloaded players registry
    const dlIdx = Game.downloadedPlayers.findIndex(m => m.id === formattedPlayer.id || m.name === formattedPlayer.name);
    if (dlIdx >= 0) {
      Game.downloadedPlayers[dlIdx] = formattedPlayer;
    } else {
      Game.downloadedPlayers.unshift(formattedPlayer);
    }

    // Insert at the VERY FRONT of the transfer market
    const existingIdx = Game.transferMarket.findIndex(m => m.id === formattedPlayer.id || m.name === formattedPlayer.name);
    if (existingIdx >= 0) {
      Game.transferMarket.splice(existingIdx, 1);
    }
    Game.transferMarket.unshift(formattedPlayer);
    newlyAddedCount++;
  });

  const nowStr = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  Game.serverConfig.lastSyncDate = nowStr;
  Game.serverConfig.syncStatus = 'online';
  Game.serverConfig.loadedDropsCount = (Game.serverConfig.loadedDropsCount || 0) + newlyAddedCount;
  if (versionKey) {
    Game.serverConfig.lastKnownVersion = versionKey;
  }
  if (fingerprint) {
    Game.serverConfig.lastContentFingerprint = fingerprint;
  } else {
    Game.serverConfig.lastContentFingerprint = computePlayersFingerprint(fetchedPlayers);
  }

  // Pre-configure transfers view tab & filter so user sees the downloaded players directly
  transferActiveTab = 'market';
  Game.serverConfig.activeMarketFilter = 'downloaded';

  // Add breaking news & Inbox memo
  Game.newsFeed.unshift({
    title: `🔥 تم تنزيل وتثبيت دفعة السيرفر: ${weekTitle}`,
    time: `اليوم (${nowStr})`,
    type: 'world'
  });

  Game.inbox.unshift({
    id: `msg_server_drop_${Date.now()}`,
    senderName: 'شبكة الكشافة وسيرفر Firebase',
    senderRole: 'تحديثات سوق الانتقالات الأسبوعية',
    senderAvatar: '🔥',
    subject: `🔥 تم تنزيل ${fetchedPlayers.length} لاعبين جدد إلى سوق الانتقالات (${weekTitle})`,
    body: `كابتن ${Game.manager.name}، لقد تم تثبيت وتخزين بطاقات اللاعبين الجدد من قاعدة بيانات Firebase في لعبتك بنجاح! تم دمج ${fetchedPlayers.length} نجوم جدد في سوق الانتقالات وهم معروضون الآن للتعاقد معهم. يمكنك إيقاف النت ومتابعة اللعب أوفلاين في أي وقت.`,
    date: `يوم ${Game.day}`,
    read: false,
    type: 'transfer'
  });

  saveGameToStorage();
  updateTopHeader();

  SoundFx.playFanChant();
  startFireworks();

  openWeeklyDropSuccessModal(weekTitle, fetchedPlayers.map(normalizePlayerObject).filter(Boolean), syncSource);

  if (currentActiveView === 'server_drops') {
    const mainView = document.getElementById('main-content');
    if (mainView) renderServerDropsHub(mainView);
  } else {
    const mainView = document.getElementById('main-content');
    if (mainView) renderTransfers(mainView);
  }
}

// Fetch Weekly Drops from Live Remote Server Endpoint or Fallback Presets
async function syncWeeklyDropsFromServer(forcePresetIndex = null, notify = true, forceDownload = false) {
  ensureServerConfig();

  if (forcePresetIndex !== null) {
    // Force specific preset pack
    const pack = PRESET_WEEKLY_DROPS[forcePresetIndex % PRESET_WEEKLY_DROPS.length];
    Game.serverConfig.currentWeekNumber = pack.week;
    const fp = computePlayersFingerprint(pack.players);
    applyDownloadedPlayersToMarket(pack.title, pack.players, `preset_w${pack.week}`, `حزمة الأسبوع ${pack.week}`, fp);
    return;
  }

  // Regular server check: detects if server has new content and downloads only once!
  await checkServerForNewDrops(notify, forceDownload);
}

// 1-Click Download Presets directly into transfers
function downloadPresetPackToTransfers(packIndex) {
  SoundFx.playClick();
  const pack = PRESET_WEEKLY_DROPS[packIndex % PRESET_WEEKLY_DROPS.length];
  applyDownloadedPlayersToMarket(pack.title, pack.players, `preset_w${pack.week}`, `حزمة الأسبوع ${pack.week}`);
  transferActiveTab = 'market';
  Game.serverConfig.activeMarketFilter = 'downloaded';
  closeModal();
  switchView('transfers');
}

function downloadAllPresetPacksToTransfers() {
  SoundFx.playClick();
  let allPlayers = [];
  PRESET_WEEKLY_DROPS.forEach(p => {
    allPlayers = allPlayers.concat(p.players);

  applyDownloadedPlayersToMarket('جميع حزم نجوم وأساطير السيرفر (16 لاعب)', allPlayers, 'all_presets', 'سيرفر الحزم الرسمية الشاملة');

  closeModal();
  switchView('transfers');
}

function exportServerDatabaseJson() {
  const exportPayload = {
    game: "VORSA: CAREER MODE",
    version: "2.5",
    updatedAt: new Date().toISOString(),
    week: Game.serverConfig ? Game.serverConfig.currentWeekNumber : 1,
    title: `تحديث سوق الانتقالات الأسبوعي`,
    totalPlayers: Game.transferMarket.length,
    players: Game.transferMarket
  };

  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportPayload, null, 2));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `VORSA_SERVER_WEEKLY_DROPS.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function switchTransferTab(tab) {
  SoundFx.playClick();
  transferActiveTab = tab;
  renderTransfers(document.getElementById('main-content'));
}

function togglePlayerTransferList(playerId) {
  SoundFx.playClick();
  const p = Game.squad.find(x => x.id === playerId);
  if (!p) return;
  p.listedForTransfer = !p.listedForTransfer;
  if (p.listedForTransfer) {
    alert(`📢 تم إدراج اللاعب ${p.name} في سوق الانتقالات رسميًا. ستصلك عروض الأندية في صندوق البريد قريبًا.`);
  } else {
    alert(`تم سحب اللاعب ${p.name} من سوق الانتقالات.`);
  }
  saveGameToStorage();
  renderTransfers(document.getElementById('main-content'));
}

let currentNegotiationState = null;

function startBuyingNegotiation(playerId) {
  SoundFx.playClick();
  const player = Game.transferMarket.find(p => p.id === playerId);
  if (!player) return;

  const club = CLUBS_DATABASE.find(c => c.id === player.clubId) || { name: 'نادي اللاعب', badge: '🛡️' };

  currentNegotiationState = {
    player: player,
    sellerClub: club,
    stage: 'club', // 'club', 'player', 'completed'
    initialAskingFee: player.value,
    currentOfferFee: player.value,
    clausePercent: 10,
    wageOffer: player.wage || 30000,
    contractYears: 3,
    sellerPatience: 3, // 3 tries before walkout
    sellerMood: 'neutral', // 'friendly', 'neutral', 'tough'
    dialogue: `مرحبًا يا كابتن ${Game.manager.name}. نرحب باهتمامكم بضم نجمنا ${player.name}. السعر المبدئي الذي نطلبه هو ${(player.value/1000000).toFixed(1)} مليون جنيه مصري.`
  };

  openNegotiationModal();
}

  const el = document.getElementById('nego-fee-val');
  if (el) el.innerText = `${(val/1000000).toFixed(1)} مليون جنيه`;
}

function updateNegoWage(val) {
  currentNegotiationState.wageOffer = parseInt(val);
  const el = document.getElementById('nego-wage-val');
  if (el) el.innerText = `${parseInt(val).toLocaleString()} ج.م / أسبوع`;
}

function submitClubFeeOffer() {
  SoundFx.playClick();
  const s = currentNegotiationState;
  const asking = s.initialAskingFee;
  const offered = s.currentOfferFee;

  if (Game.club.budget < offered) {
    alert(`عذرًا! ميزانيتك (${(Game.club.budget/1000000).toFixed(1)}M) لا تغطي هذا العرض.`);
    return;
  }

  // Club response logic
  if (offered >= asking * 0.95) {
    // Accepted
    SoundFx.playFanChant();
    s.stage = 'player';
    s.dialogue = `يسرنا التوصل لاتفاق مع إدارة ناديكم الموقرة. الآن ننتقل للاتفاق على الراتب الأسبوعي ومكافآت التوقيع مع اللاعب.`;
    openNegotiationModal();
  } else if (offered >= asking * 0.8) {
    // Counter offer
    s.sellerPatience -= 1;
    if (s.sellerPatience <= 0) {
      alert(`❌ ممثل النادي: "عرضكم بعيد جداً ومضيعة للوقت! قررنا إيقاف المفاوضات فوراً".`);
      closeModal();
      return;
    }
    const counterFee = Math.round((asking + offered) / 2);
    s.dialogue = `عرضكم بقيمة ${(offered/1000000).toFixed(1)}M منخفض، لكننا مستعدون لخفض مطالبنا إلى ${(counterFee/1000000).toFixed(1)}M ج.م لحسم الصفقة.`;
    s.initialAskingFee = counterFee;
    openNegotiationModal();
  } else {
    // Insulted / Far
    s.sellerPatience -= 1;
    if (s.sellerPatience <= 0) {
      alert(`❌ ممثل النادي غادر طاولة المفاوضات بسبب انخفاض العرض الشديد!`);
      closeModal();
      return;
    }
    s.dialogue = `هذا العرض لا يليق بنجم بحجم ${s.player.name}. ارفعوا العرض أو سننهي المفاوضات!`;
    openNegotiationModal();
  }
}

function submitPlayerContractOffer() {
  SoundFx.playClick();
  const s = currentNegotiationState;
  const p = s.player;

  if (s.wageOffer < p.wage * 0.9) {
    s.dialogue = `اللاعب غير راضٍ عن هذا الراتب. يطلب على الأقل ${(Math.round(p.wage * 1.05)).toLocaleString()} ج.م / أسبوع.`;
    openNegotiationModal();
    return;
  }

  // Finalize purchase
  SoundFx.playFanChant();
  startFireworks();

  Game.club.budget -= s.currentOfferFee;
  p.clubId = Game.club.id;
  p.isStarter = false;
  p.wage = s.wageOffer;
  p.contractYears = s.contractYears;
  p.morale = 95;

  // Add to squad
  Game.squad.push(p);

  // Remove from market
  const idx = Game.transferMarket.findIndex(x => x.id === p.id);
  if (idx !== -1) Game.transferMarket.splice(idx, 1);

  // News ticker
  Game.newsFeed.unshift({
    title: `🔥 رسميًا: ${Game.club.name} يوقع مع النجم ${p.name} مقابل ${(s.currentOfferFee/1000000).toFixed(1)} مليون جنيه!`,
    time: `يوم ${Game.day}`,
    type: 'transfer'
  });

  Game.fanSatisfaction = Math.min(100, Game.fanSatisfaction + 5);
  s.stage = 'completed';
  saveGameToStorage();
  updateTopHeader();
  openNegotiationModal();
}

/* =========================================================================
   OFFER NEGOTIATION / SALE OF USER PLAYERS (مفاوضات بيع لاعبينا)
   ========================================================================= */

function acceptTransferOffer(offerId) {
  SoundFx.playFanChant();
  const offerIdx = Game.transferOffers.findIndex(o => o.id === offerId);
  if (offerIdx === -1) return;
  const offer = Game.transferOffers[offerIdx];

  const pIdx = Game.squad.findIndex(p => p.id === offer.playerId);
  if (pIdx === -1) return;
  const player = Game.squad[pIdx];
  const buyerClub = CLUBS_DATABASE.find(c => c.id === offer.buyerClubId) || { name: 'النادي المشتري' };

  Game.club.budget += offer.amount;
  Game.squad.splice(pIdx, 1);
  Game.transferOffers.splice(offerIdx, 1);

  Game.newsFeed.unshift({
    title: `💼 رسميًا: رحيل ${player.name} إلى نادي ${buyerClub.name} مقابل ${(offer.amount/1000000).toFixed(1)} مليون جنيه`,
    time: `يوم ${Game.day}`,
    type: 'transfer'
  });

  alert(`🎉 تمت الصفقة! تم بيع اللاعب ${player.name} وضخ ${(offer.amount/1000000).toFixed(1)} مليون جنيه في ميزانية النادي.`);
  saveGameToStorage();
  updateTopHeader();
  renderTransfers(document.getElementById('main-content'));
}

function rejectTransferOffer(offerId) {
  SoundFx.playClick();
  const offerIdx = Game.transferOffers.findIndex(o => o.id === offerId);
  if (offerIdx === -1) return;
  Game.transferOffers.splice(offerIdx, 1);
  alert('تم رفض العرض وإبلاغ النادي المشتري بقرار الإدارة.');
  saveGameToStorage();
  renderTransfers(document.getElementById('main-content'));
}

function openOfferNegotiationModal(offerId) {
  SoundFx.playClick();
  const offer = Game.transferOffers.find(o => o.id === offerId);
  if (!offer) return;

  const targetPlayer = Game.squad.find(p => p.id === offer.playerId);
  const buyerClub = CLUBS_DATABASE.find(c => c.id === offer.buyerClubId);
  const counterAmount = Math.round(offer.amount * 1.25);

  const modalBody = document.getElementById('modal-body');
  modalBody.innerHTML = `
    <div style="font-size:16px; font-weight:900; color:var(--accent-gold); margin-bottom:12px;">
      🔄 طاولة مفاوضات البيع مع ${buyerClub.name}
    </div>
    <p style="font-size:12px; color:var(--text-muted); line-height:1.6; margin-bottom:14px;">
      العرض الحالي لشراء <b>${targetPlayer.name}</b> هو ${(offer.amount/1000000).toFixed(1)}M ج.م.<br>
      يمكنك تقديم طلب مضاد بزيادة السعر إلى <b>${(counterAmount/1000000).toFixed(1)}M ج.م (+25%)</b>.
    </p>

    <div class="grid-2">
      <button class="btn btn-accent btn-lg" onclick="processSaleCounterOffer('${offer.id}', ${counterAmount})">
        💰 طلب ${(counterAmount/1000000).toFixed(1)}M ج.م
      </button>
      <button class="btn btn-secondary btn-lg" onclick="closeModal()">
        إلغاء
      </button>
    </div>
  `;
  openModal();
}

function processSaleCounterOffer(offerId, counterAmount) {
  SoundFx.playClick();
  const offer = Game.transferOffers.find(o => o.id === offerId);
  if (!offer) return;

  // 65% probability of acceptance
  if (Math.random() < 0.65) {
    offer.amount = counterAmount;
    alert(`🎉 وافق النادي المشتري على زيادة السعر إلى ${(counterAmount/1000000).toFixed(1)} مليون جنيه! يمكنك الآن تأكيد وقبول البيع.`);
  } else {
    alert(`❌ رفض النادي المشتري زيادة السعر وتمسك بعرضه الأصلي.`);
  }
  closeModal();
  saveGameToStorage();
  renderTransfers(document.getElementById('main-content'));
}

// Simulate Stages of Champions League
function simulateUCLStage(stage) {
  SoundFx.playClick();
  const ucl = Game.championsLeague;
  if (!ucl) return;

  if (stage === 'quarter') {
    ucl.quarterFinals.forEach(m => {
      if (!m.played) {
        // Higher rep has slight advantage + randomness
        const isUserMatch = m.team1.id === Game.club.id || m.team2.id === Game.club.id;
        let s1 = Math.floor(Math.random() * 4);
        let s2 = Math.floor(Math.random() * 4);
        if (s1 === s2) {
          // Extra time / penalties winner
          if (Math.random() > 0.5) s1 += 1; else s2 += 1;
        }
        m.score1 = s1;
        m.score2 = s2;
        m.played = true;
        m.winner = s1 > s2 ? m.team1 : m.team2;

        if (isUserMatch) {
          const userWon = m.winner.id === Game.club.id;
          if (userWon) {
            Game.fanSatisfaction = Math.min(100, Game.fanSatisfaction + 8);
            Game.boardTrust = Math.min(100, Game.boardTrust + 6);
            Game.club.budget += 15000000; // 15M prize
            Game.newsFeed.unshift({ title: `🌟 ${Game.club.name} يتأهل لنصف نهائي دوري أبطال النخبة بعد ملحمة قارية!`, time: `يوم ${Game.day}`, type: 'ucl' });
          } else {
            Game.fanSatisfaction = Math.max(0, Game.fanSatisfaction - 5);
            Game.newsFeed.unshift({ title: `💔 وداع قاري.. خروج ${Game.club.name} من ربع نهائي دوري أبطال النخبة`, time: `يوم ${Game.day}`, type: 'ucl' });
          }
        }
      }
    });

    // Populate Semi Finals
    ucl.semiFinals[0].team1 = ucl.quarterFinals[0].winner;
    ucl.semiFinals[0].team2 = ucl.quarterFinals[1].winner;
    ucl.semiFinals[1].team1 = ucl.quarterFinals[2].winner;
    ucl.semiFinals[1].team2 = ucl.quarterFinals[3].winner;
    ucl.currentStage = 'semi';

    SoundFx.playWhistle();
    alert('✅ انتهت جميع مباريات ربع نهائي دوري أبطال النخبة وتأهلت الأندية الـ 4 لنصف النهائي!');
  } else if (stage === 'semi') {
    ucl.semiFinals.forEach(m => {
      if (!m.played && m.team1 && m.team2) {
        let s1 = Math.floor(Math.random() * 4);
        let s2 = Math.floor(Math.random() * 4);
        if (s1 === s2) {
          if (Math.random() > 0.5) s1 += 1; else s2 += 1;
        }
        m.score1 = s1;
        m.score2 = s2;
        m.played = true;
        m.winner = s1 > s2 ? m.team1 : m.team2;

        const isUserMatch = m.team1.id === Game.club.id || m.team2.id === Game.club.id;
        if (isUserMatch) {
          const userWon = m.winner.id === Game.club.id;
          if (userWon) {
            Game.fanSatisfaction = Math.min(100, Game.fanSatisfaction + 12);
            Game.boardTrust = Math.min(100, Game.boardTrust + 8);
            Game.club.budget += 30000000; // 30M prize
            Game.newsFeed.unshift({ title: `👑 رسمياً: ${Game.club.name} يعبر إلى نهائي دوري أبطال النخبة الحلم!`, time: `يوم ${Game.day}`, type: 'ucl' });
          } else {
            Game.newsFeed.unshift({ title: `سقوط في المربع الذهبي.. خروج ${Game.club.name} من نصف نهائي دوري الأبطال`, time: `يوم ${Game.day}`, type: 'ucl' });
          }
        }
      }
    });

    ucl.finalMatch.team1 = ucl.semiFinals[0].winner;
    ucl.finalMatch.team2 = ucl.semiFinals[1].winner;
    ucl.currentStage = 'final';

    SoundFx.playWhistle();
    alert('🔥 تحدد رسمياً طرفا نهائي دوري أبطال النخبة! الاستعداد لموقعة حسم اللقب القاري.');
  } else if (stage === 'final') {
    const fn = ucl.finalMatch;
    if (!fn.played && fn.team1 && fn.team2) {
      let s1 = Math.floor(Math.random() * 4);
      let s2 = Math.floor(Math.random() * 4);
      if (s1 === s2) {
        if (Math.random() > 0.5) s1 += 1; else s2 += 1;
      }
      fn.score1 = s1;
      fn.score2 = s2;
      fn.played = true;
      fn.winner = s1 > s2 ? fn.team1 : fn.team2;
      ucl.champion = fn.winner;
      ucl.currentStage = 'completed';

      const userWon = fn.winner.id === Game.club.id;
      if (userWon) {
        ucl.trophyWon = true;
        Game.manager.trophies = (Game.manager.trophies || 0) + 1;
        Game.fanSatisfaction = 100;
        Game.boardTrust = 100;
        Game.club.budget += 80000000; // 80M Champion prize
        SoundFx.playFanChant();
        startFireworks();
        alert(`🏆 مبروك يا كابتن ${Game.manager.name}!\nفريقك [${Game.club.name}] هو بطل دوري أبطال النخبة القاري رسمياً!\nتمت إضافة مكافأة التتويج (80 مليون جنيه) لخزينة النادي!`);
        Game.newsFeed.unshift({ title: `🏆 عرش القارة: ${Game.club.name} يتوج بطلاً لدوري أبطال النخبة بعد فوز أسطوري (${s1}-${s2})!`, time: `يوم ${Game.day}`, type: 'ucl' });
      } else {
        SoundFx.playWhistle();
        alert(`صافرة النهاية: توج [${fn.winner.name}] بلقب دوري أبطال النخبة بعد الفوز بنتيجة (${s1}-${s2}). هاردلك لفريقك ومسيرة قارية مشرفة!`);
        Game.newsFeed.unshift({ title: `🏆 ${fn.winner.name} يتوج بلقب دوري أبطال النخبة بعد الفوز في النهائي الكبير`, time: `يوم ${Game.day}`, type: 'ucl' });
      }
    }
  }

  saveGameToStorage();
  updateTopHeader();
  renderStandings(document.getElementById('main-content'));
}

function getStatMetricValue(player, tab) {
  if (!player) return 0;
  if (tab === 'scorers') return player.goals || 0;
  if (tab === 'assists') return player.assists || 0;
  if (tab === 'appearances') return player.appearances || 0;
  if (tab === 'cleansheets') return player.cleanSheets || 0;
  if (tab === 'cards') return `${player.yellowCards || 0}🟨 ${player.redCards || 0}🟥`;
  return 0;
}

function initStatsChart(players, tab, metricLabel) {
  const canvas = document.getElementById('statsChartCanvas');
  if (!canvas) return;

  if (statsChartInstance) {
    statsChartInstance.destroy();
    statsChartInstance = null;
  }

  const labels = players.map(p => {
    const club = getClubById(p.clubId);
    return `${p.name} (${club.badge})`;
  });

  const dataValues = players.map(p => {
    if (tab === 'scorers') return p.goals || 0;
    if (tab === 'assists') return p.assists || 0;
    if (tab === 'appearances') return p.appearances || 0;
    if (tab === 'cleansheets') return p.cleanSheets || 0;
    if (tab === 'cards') return (p.yellowCards || 0) + (p.redCards || 0) * 3;
    return 0;
  });

  // Check if Chart.js is loaded
  if (typeof Chart !== 'undefined' && canvas && typeof canvas.getContext === 'function') {
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, 200);
    gradient.addColorStop(0, '#38BDF8');
    gradient.addColorStop(1, '#1E60FF');

    statsChartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: metricLabel,
          data: dataValues,
          backgroundColor: gradient,
          borderColor: 'rgba(255, 255, 255, 0.4)',
          borderWidth: 1,
          borderRadius: 8,
          barThickness: 24
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            titleFont: { family: 'Cairo', size: 12 },
            bodyFont: { family: 'Cairo', size: 12 },
            callbacks: {
              label: (context) => ` ${metricLabel}: ${context.raw}`
            }
          }
        },
        scales: {
          x: {
            ticks: {
              color: '#94A3B8',
              font: { family: 'Cairo', size: 10, weight: '700' }
            },
            grid: { display: false }
          },
          y: {
            beginAtZero: true,
            ticks: {
              color: '#94A3B8',
              font: { family: 'Cairo', size: 10 },
              stepSize: 1
            },
            grid: {
              color: 'rgba(255, 255, 255, 0.06)'
            }
          }
        }
      }
    });
  } else {
    // HTML5 Canvas fallback
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.parentElement.clientWidth || 340;
    canvas.height = 200;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '12px Cairo, sans-serif';
    ctx.fillText('📊 رسم بياني توضيحي للمتصدرين', 10, 20);
    
    const maxVal = Math.max(...dataValues, 1);
    const barWidth = (canvas.width - 60) / Math.max(players.length, 1);
    
    players.forEach((p, i) => {
      const val = dataValues[i];
      const h = (val / maxVal) * 120;
      const x = 30 + i * barWidth;
      const y = 160 - h;
      
      ctx.fillStyle = '#1E60FF';
      ctx.fillRect(x, y, barWidth - 8, h);
      
      ctx.fillStyle = '#fff';
      ctx.font = '10px Cairo, sans-serif';
      ctx.fillText(String(val), x + 4, y - 4);
      
      ctx.fillStyle = '#94A3B8';
      ctx.fillText(p.name.split(' ')[0], x, 180);
    });
  }
}

function upgradeFacility(key) {
  const fac = Game.facilities[key];
  if (fac.level >= fac.max) return;
  if (Game.club.budget < fac.cost) {
    alert('الميزانية لا تكفي لإتمام هذا التطوير!');
    return;
  }
  SoundFx.playClick();
  Game.club.budget -= fac.cost;
  fac.level += 1;
  fac.cost = Math.round(fac.cost * 1.5);
  Game.boardTrust = Math.min(100, Game.boardTrust + 3);
  saveGameToStorage();
  switchView('club');
}

function pauseOrResumeLiveMatch() {

  } else {

  }
  openMatchdayModal();
}

function runLiveMatchSimulation() {
  const nextMatch = Game.seasonFixtures.find(f => !f.played);
  if (!nextMatch) return;

  isLiveSimRunning = true;
  SoundFx.playWhistle();

  const isHome = nextMatch.home.id === Game.club.id;
  const userTeam = Game.club;
  const opp = isHome ? nextMatch.away : nextMatch.home;

  const starters = Game.squad.filter(p => p.isStarter);
  const avgUserRating = starters.reduce((acc, p) => acc + p.ovr, 0) / (starters.length || 1);
  const oppRating = opp.reputation;
  const powerDiff = (avgUserRating - oppRating) + (Game.tactics.mentality === 'attacking' ? 3 : 0);

  const feed = document.getElementById('live-match-feed');
  const clock = document.getElementById('live-match-clock');
  const scoreDisplay = document.getElementById('live-score');
  const actionCont = document.getElementById('match-sim-action-container');

  if (actionCont) {
    actionCont.innerHTML = `
      <div class="grid-2" style="margin-top:12px;">
        <button class="btn btn-gold" onclick="openLiveSubstitutionsModal()">🔄 تبديل سريع (${Game.liveSubsLeft})</button>
        <button class="btn btn-secondary" onclick="pauseOrResumeLiveMatch()">⏸️ إيقاف مؤقت</button>
      </div>
    `;
  }

  liveSimTimer = setInterval(() => {
    liveMatchState.min += Math.floor(Math.random() * 7) + 4;
    if (liveMatchState.min > 90) liveMatchState.min = 90;

    if (clock) clock.innerText = `الدقيقة ${liveMatchState.min}'`;

    // Probability of events
    const rand = Math.random() * 100;
    if (rand < 24) {
      // Goal Chance
      const userScored = Math.random() * 100 < (50 + powerDiff * 2);
      if (userScored) {
        if (isHome) liveMatchState.homeScore++; else liveMatchState.awayScore++;
        SoundFx.playGoal();
        const activeStarters = Game.squad.filter(p => p.isStarter);
        const scorer = activeStarters[Math.floor(Math.random() * activeStarters.length)] || { name: 'المهاجم' };
        scorer.goals = (scorer.goals || 0) + 1;
        const evHtml = `⚽ الدقيقة ${liveMatchState.min}' — جوووول! ${scorer.name} يسجل لصالح ${userTeam.name}!`;
        liveMatchState.feedEvents.unshift(evHtml);
        if (feed) feed.insertAdjacentHTML('afterbegin', `<div class="feed-event goal">${evHtml}</div>`);
      } else {
        if (isHome) liveMatchState.awayScore++; else liveMatchState.homeScore++;
        SoundFx.playWhistle();
        const evHtml = `⚽ الدقيقة ${liveMatchState.min}' — هدف للخصم! ${opp.name} يباغت الشباك.`;
        liveMatchState.feedEvents.unshift(evHtml);
        if (feed) feed.insertAdjacentHTML('afterbegin', `<div class="feed-event goal" style="background:rgba(239,68,68,0.2);color:#EF4444;">${evHtml}</div>`);
      }
      if (scoreDisplay) scoreDisplay.innerText = `${liveMatchState.homeScore} - ${liveMatchState.awayScore}`;
    } else if (rand < 36) {
      const evHtml = `🟨 الدقيقة ${liveMatchState.min}' — بطاقة صفراء إثر تدخل قوي في وسط الملعب.`;
      liveMatchState.feedEvents.unshift(evHtml);
      if (feed) feed.insertAdjacentHTML('afterbegin', `<div class="feed-event card">${evHtml}</div>`);
    }

    if (liveMatchState.min >= 90) {
      clearInterval(liveSimTimer);
      isLiveSimRunning = false;
      SoundFx.playWhistle();
      const endMsg = `🏁 صافرة النهاية! النتيجة النهائية: ${liveMatchState.homeScore} - ${liveMatchState.awayScore}`;
      liveMatchState.feedEvents.unshift(endMsg);
      if (feed) feed.insertAdjacentHTML('afterbegin', `<div class="feed-event" style="font-weight:900;color:var(--accent-gold);">${endMsg}</div>`);
      
      nextMatch.played = true;
      nextMatch.homeScore = liveMatchState.homeScore;
      nextMatch.awayScore = liveMatchState.awayScore;

      finishMatchday(nextMatch, liveMatchState.homeScore, liveMatchState.awayScore);
    }
  }, 350);
}

function executeLiveSubstitution() {
  const outSelect = document.getElementById('sub-out-select');
  const inSelect = document.getElementById('sub-in-select');
  if (!outSelect || !inSelect) return;

  const outId = outSelect.value;
  const inId = inSelect.value;

  const outP = Game.squad.find(p => p.id === outId);
  const inP = Game.squad.find(p => p.id === inId);

  if (!outP || !inP) return;

  SoundFx.playWhistle();
  outP.isStarter = false;
  inP.isStarter = true;
  Game.liveSubsLeft -= 1;

  // Boost inP morale and reward promised playtime
  inP.morale = Math.min(100, inP.morale + 10);
  if (inP.promisedStart) inP.promisedStart = false;

  const subLog = `🔄 تبديل تكتيكي لـ ${Game.club.name} (د' ${liveMatchState.min}): خروج [${outP.name} 🔻] ودخول [${inP.name} 🔺]`;
  liveMatchState.feedEvents.unshift(subLog);

  saveGameToStorage();
  openMatchdayModal();
}

}

function finishMatchday(match, homeScore, awayScore) {
  const isHome = match.home.id === Game.club.id;
  const userScore = isHome ? homeScore : awayScore;
  const oppScore = isHome ? awayScore : homeScore;

  // Update Manager Stats
  Game.manager.matchesManaged = (Game.manager.matchesManaged || 0) + 1;
  Game.manager.goalsFor = (Game.manager.goalsFor || 0) + userScore;
  Game.manager.goalsAgainst = (Game.manager.goalsAgainst || 0) + oppScore;
  if (oppScore === 0) {
    Game.manager.cleanSheets = (Game.manager.cleanSheets || 0) + 1;
  }

  // Update User Starters appearances and minutes
  Game.squad.forEach(p => {
    if (p.isStarter) {
      p.appearances = (p.appearances || 0) + 1;
      p.minutes = (p.minutes || 0) + 90;
      if (p.pos === 'GK' && oppScore === 0) {
        p.cleanSheets = (p.cleanSheets || 0) + 1;
      }
    }
  });

  // Simulate other fixtures in this round to populate all league stats
  const otherClubs = CLUBS_DATABASE.filter(c => c.id !== Game.club.id);
  for (let i = 0; i < otherClubs.length; i += 2) {
    if (i + 1 < otherClubs.length) {
      const c1 = otherClubs[i];
      const c2 = otherClubs[i + 1];
      const s1 = Math.floor(Math.random() * 4);
      const s2 = Math.floor(Math.random() * 3);

      const st1 = Game.leagueStandings.find(s => s.id === c1.id);
      const st2 = Game.leagueStandings.find(s => s.id === c2.id);
      if (st1 && st2) {
        st1.played += 1; st1.gf += s1; st1.ga += s2; st1.gd = st1.gf - st1.ga;
        st2.played += 1; st2.gf += s2; st2.ga += s1; st2.gd = st2.gf - st2.ga;
        if (s1 > s2) { st1.won++; st1.points += 3; st2.lost++; }
        else if (s1 === s2) { st1.drawn++; st1.points += 1; st2.drawn++; st2.points += 1; }
        else { st2.won++; st2.points += 3; st1.lost++; }
      }

      // Assign stats to simulated players
      if (Game.leaguePlayers && Game.leaguePlayers.length > 0) {
        const c1Players = Game.leaguePlayers.filter(p => p.clubId === c1.id);
        const c2Players = Game.leaguePlayers.filter(p => p.clubId === c2.id);
        
        c1Players.slice(0, 11).forEach(p => {
          p.appearances = (p.appearances || 0) + 1;
          p.minutes = (p.minutes || 0) + 90;
          if (p.pos === 'GK' && s2 === 0) p.cleanSheets = (p.cleanSheets || 0) + 1;
        });
        c2Players.slice(0, 11).forEach(p => {
          p.appearances = (p.appearances || 0) + 1;
          p.minutes = (p.minutes || 0) + 90;
          if (p.pos === 'GK' && s1 === 0) p.cleanSheets = (p.cleanSheets || 0) + 1;
        });

        // Award goals & assists
        for (let g = 0; g < s1; g++) {
          const attackers = c1Players.filter(p => ['ST', 'RW', 'LW', 'CAM', 'CM'].includes(p.pos));
          if (attackers.length > 0) {
            const scorer = attackers[Math.floor(Math.random() * attackers.length)];
            scorer.goals = (scorer.goals || 0) + 1;
            const assister = attackers[Math.floor(Math.random() * attackers.length)];
            if (assister.id !== scorer.id) assister.assists = (assister.assists || 0) + 1;
          }
        }
        for (let g = 0; g < s2; g++) {
          const attackers = c2Players.filter(p => ['ST', 'RW', 'LW', 'CAM', 'CM'].includes(p.pos));
          if (attackers.length > 0) {
            const scorer = attackers[Math.floor(Math.random() * attackers.length)];
            scorer.goals = (scorer.goals || 0) + 1;
            const assister = attackers[Math.floor(Math.random() * attackers.length)];
            if (assister.id !== scorer.id) assister.assists = (assister.assists || 0) + 1;
          }
        }
      }
    }
  }

  // Update Standings for User & Opponent
  const userStanding = Game.leagueStandings.find(s => s.id === Game.club.id);
  const oppStanding = Game.leagueStandings.find(s => s.id === (isHome ? match.away.id : match.home.id));

  if (userStanding && oppStanding) {
    userStanding.played += 1;
    userStanding.gf += userScore;
    userStanding.ga += oppScore;
    userStanding.gd = userStanding.gf - userStanding.ga;

    oppStanding.played += 1;
    oppStanding.gf += oppScore;
    oppStanding.ga += userScore;
    oppStanding.gd = oppStanding.gf - oppStanding.ga;

    if (userScore > oppScore) {
      userStanding.won += 1;
      userStanding.points += 3;
      oppStanding.lost += 1;
      Game.boardTrust = Math.min(100, Game.boardTrust + 4);
      Game.fanSatisfaction = Math.min(100, Game.fanSatisfaction + 6);
      Game.teamMorale = Math.min(100, Game.teamMorale + 5);
      Game.manager.wins += 1;
      Game.club.budget += 600000; // Match win bonus
      Game.newsFeed.unshift({ title: `🔥 فوز مستحق لـ ${Game.club.name} (${userScore}-${oppScore}) وسط احتفالات جماهيرية كبرى`, time: `يوم ${Game.day}`, type: 'win' });
    } else if (userScore === oppScore) {
      userStanding.drawn += 1;
      userStanding.points += 1;
      oppStanding.drawn += 1;
      oppStanding.points += 1;
      Game.manager.draws += 1;
      Game.newsFeed.unshift({ title: `تعادل مثير لـ ${Game.club.name} (${userScore}-${oppScore}) في جولة مشتعلة`, time: `يوم ${Game.day}`, type: 'draw' });
    } else {
      userStanding.lost += 1;
      oppStanding.won += 1;
      oppStanding.points += 3;
      Game.boardTrust = Math.max(0, Game.boardTrust - 5);
      Game.fanSatisfaction = Math.max(0, Game.fanSatisfaction - 7);
      Game.teamMorale = Math.max(0, Game.teamMorale - 6);
      Game.manager.losses += 1;
      Game.newsFeed.unshift({ title: `🚨 غضب جماهيري وانتقادات بعد خسارة ${Game.club.name} (${userScore}-${oppScore})`, time: `يوم ${Game.day}`, type: 'loss' });
    }
  }

  Game.currentRound += 1;
  Game.day += 5;
  
  // Trigger player interactions and inbox events
  checkAndTriggerPlayerInboxEvents();

  saveGameToStorage();
  updateTopHeader();

  const feed = document.getElementById('live-match-feed');
  feed.insertAdjacentHTML('afterbegin', `
    <div style="margin-top:14px;">
      <button class="btn btn-accent btn-lg" onclick="closeModal(); openPressConference('post');">
        🎤 حضور المؤتمر الصحفي بعد المباراة
      </button>
    </div>
  `);
}

function advanceDay() {
  SoundFx.playClick();
  Game.day += 1;

  // Small random event chances
  if (Math.random() < 0.25) {
    triggerRandomEvent();

  Game.squad.forEach(p => {
    p.fitness = Math.min(100, p.fitness + 5);
    if (p.injuryMatches > 0) p.injuryMatches -= 1;

  saveGameToStorage();
  updateTopHeader();
  switchView(currentActiveView);
}

let _activePressConferenceSession = {
  type: 'pre',
  questions: [],
  currentIndex: 0,
  journalist: null
};

function openPressConference(type = 'pre') {
  SoundFx.playClick();
  const journo = Game.journalists[Math.floor(Math.random() * Game.journalists.length)];
  const pool = type === 'pre' ? EXPANDED_PRE_MATCH_QUESTIONS : EXPANDED_POST_MATCH_QUESTIONS;
  
  // Pick 2 distinct questions for interactive conference
  const shuffled = [...pool].sort(() => 0.5 - Math.random());
  const selectedQuestions = shuffled.slice(0, 2);

  _activePressConferenceSession = {
    type: type,
    questions: selectedQuestions,
    currentIndex: 0,
    journalist: journo
  };

  renderPressConferenceQuestion();
}

function renderPressConferenceQuestion() {
  const session = _activePressConferenceSession;
  if (!session || session.currentIndex >= session.questions.length) {
    closeModal();
    return;
  }

  const qObj = session.questions[session.currentIndex];
  const journo = session.journalist;
  const isLast = session.currentIndex === session.questions.length - 1;

  const modalBody = document.getElementById('modal-body');
  modalBody.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <div style="font-size:15px; font-weight:900; color:var(--accent-cyan); display:flex; align-items:center; gap:6px;">
        🎤 قاعة المؤتمرات الصحفية الرسمية
      </div>
      <span class="badge" style="background:rgba(56,189,248,0.15); color:var(--accent-cyan); font-weight:800; font-size:11px; padding:3px 8px; border-radius:12px;">
        السؤال ${session.currentIndex + 1} من ${session.questions.length}
      </span>
    </div>

    <!-- Journalist Identity Card -->
    <div class="journalist-box" style="background:rgba(255,255,255,0.04); border:1px solid var(--border-card); border-radius:10px; padding:10px 12px; display:flex; align-items:center; gap:10px; margin-bottom:12px;">
      <div class="journalist-avatar" style="font-size:26px;">🎙️</div>
      <div>
        <div style="font-weight:900; font-size:13px; color:#fff;">${journo.name}</div>
        <div style="font-size:11px; color:var(--accent-gold); font-weight:700;">${journo.outlet} • <span style="color:var(--text-muted); font-size:10px;">${journo.desc}</span></div>
      </div>
    </div>

    <!-- Question Box -->
    <div style="background:linear-gradient(135deg, rgba(30,41,59,0.7), rgba(15,23,42,0.9)); border-right:4px solid var(--accent-gold); border-radius:8px; padding:12px 14px; font-size:13px; font-weight:800; color:#fff; line-height:1.6; margin-bottom:16px;">
      « ${qObj.question} »
    </div>

    <div style="font-size:11px; color:var(--text-muted); font-weight:700; margin-bottom:8px;">
      اختر تصريحك الرسمي لوسائل الإعلام:
    </div>

    <!-- Options -->
    <div class="press-options-list" style="display:flex; flex-direction:column; gap:8px;">
      ${qObj.options.map((opt, oIdx) => `
        <button class="press-option-btn" onclick="handlePressOptionSelected(${oIdx})" style="background:rgba(255,255,255,0.03); border:1px solid var(--glass-border); border-radius:10px; padding:10px 12px; text-align:right; color:#fff; cursor:pointer; transition:all 0.2s ease;">

            <span style="font-size:11px; font-weight:800; color:var(--accent-gold);">${opt.badge}</span>
            <span style="font-size:10px; color:#34D399; font-weight:700;">${opt.impact}</span>
          </div>
          <div style="font-size:12px; font-weight:700; line-height:1.5; color:#F1F5F9;">
            ${opt.text}

      `).join('')}

  openModal();
}

function handlePressOptionSelected(optionIndex) {
  SoundFx.playClick();
  const session = _activePressConferenceSession;
  if (!session) return;

  const qObj = session.questions[session.currentIndex];
  const opt = qObj.options[optionIndex];

  if (opt && opt.effects) {

  updateTopHeader();

function updateFundsApprovalForecast() {
  const input = document.getElementById('custom-funds-amount-input');
  const box = document.getElementById('funds-board-prediction-box');
  const displayM = document.getElementById('custom-funds-display-m');
  if (!input || !box) return;

  const amount = parseInt(input.value) || 0;
  const formattedM = (amount / 1000000).toFixed(1);
  if (displayM) displayM.innerText = `${formattedM}M ج.م`;

  const sortedStandings = [...Game.leagueStandings].sort((a, b) => b.points - a.points || b.gd - a.gd);
  const currentRank = sortedStandings.findIndex(s => s.id === Game.club.id) + 1;
  const trust = Game.boardTrust;

  let chanceBadge = '';
  let chanceColor = '';
  let rationale = '';

  if (amount > 250000000) {
    chanceBadge = '🔴 احتمال الموافقة: مستحيل تقريباً (مبلغ فلكي)';
    chanceColor = '#EF4444';
    rationale = `المبلغ المطلوب (${formattedM}M) خيالي ويفوق سقف النادي. سيرفضه المجلس فوراً إلا في حال صدارة الدوري بدون منازع وثقة تفوق 92%.`;
  } else if (amount > 140000000) {
    if (currentRank <= 2 && trust >= 82) {
      chanceBadge = '🟢 احتمال الموافقة: مرتفع (مكافأة الصدارة)';
      chanceColor = '#34D399';
      rationale = `بفضل احتلال المركز #${currentRank} وثقة الإدارة المرتفعة (${trust}%)، المجلس مستعد للمغامرة بحسم صفقة قياسية!`;
    } else {
      chanceBadge = '🔴 احتمال الموافقة: ضعيف جداً (سيُرفض غالباً)';
      chanceColor = '#EF4444';
      rationale = `صفقات الـ 150M-180M تتطلب احتلال المركزين الأول أو الثاني وثقة لا تقل عن 82%. ترتيبك الحالي (#${currentRank}) وثقتك (${trust}%) ستجعل المجلس يتحفظ.`;
    }
  } else if (amount > 75000000) {
    if (currentRank <= 5 && trust >= 72) {
      chanceBadge = '🟢 احتمال الموافقة: جيد جداً';
      chanceColor = '#34D399';
      rationale = `موقع الفريق في المربع الذهبي (#${currentRank}) وثقة المجلس (${trust}%) تدعم الموافقة على هذا الدعم الفني.`;
    } else {
      chanceBadge = '🟡 احتمال الموافقة: متوسط / مخاطرة';
      chanceColor = '#F59E0B';
      rationale = `المبلغ كبير نسبياً (${formattedM}M)، وقد يتردد المجلس بسبب الترتيب المتأخر (#${currentRank}) أو انخفاض الثقة (${trust}%).`;
    }
  } else if (amount > 35000000) {
    if (currentRank <= 8 && trust >= 62) {
      chanceBadge = '🟢 احتمال الموافقة: مؤكد تقريباً';
      chanceColor = '#34D399';
      rationale = `المبلغ معقول ويتماشى مع موازنة النادي في ظل ترتيبك ونتائجك الحالية.`;
    } else {
      chanceBadge = '🟡 احتمال الموافقة: مشروط';
      chanceColor = '#F59E0B';
      rationale = `يحتاج الفريق لتحسين الثقة قليلاً لضمان تمرير الميزانية بدون معارضة.`;
    }
  } else {
    if (trust >= 52) {
      chanceBadge = '🟢 موافقة شبه مضمونة';
      chanceColor = '#34D399';
      rationale = `المبلغ في المتناول وخزينة النادي قادرة على تغطيته بسهولة.`;
    } else {
      chanceBadge = '🟡 دراسة المجلس متذبذبة';
      chanceColor = '#F59E0B';
      rationale = `ثقة الإدارة الحالية متدنية (${trust}%) وتستدعي الحذر.`;
    }
  }

  box.innerHTML = `
    <div style="font-weight:800; font-size:12px; color:${chanceColor}; margin-bottom:4px; display:flex; align-items:center; gap:6px;">
      <span>${chanceBadge}</span>
    </div>
    <div style="font-size:11px; color:var(--text-muted); line-height:1.5;">
      ${rationale}
    </div>
  `;
}

  const input = document.getElementById('custom-funds-amount-input');
  const reasonSelect = document.getElementById('custom-funds-reason-select');
  const amount = parseInt(input ? input.value : 0) || 0;
  const reason = reasonSelect ? reasonSelect.value : 'superstar';

  if (amount <= 0) {
    alert("يرجى كتابة مبلغ صحيح أكبر من الصفر!");
    return;
  }

  processFundsRequest(amount, reason);
}

function processFundsRequest(amount, reason = 'superstar') {
  SoundFx.playClick();
  
  const sortedStandings = [...Game.leagueStandings].sort((a, b) => b.points - a.points || b.gd - a.gd);
  const currentRank = sortedStandings.findIndex(s => s.id === Game.club.id) + 1;
  const formattedAmount = (amount / 1000000).toFixed(1);

  // Criteria engine based on results and requested magnitude
  let isApproved = false;
  let rejectReasonText = '';

  if (amount > 250000000) {
    if (currentRank === 1 && Game.boardTrust >= 93) {
      isApproved = true;
    } else {
      isApproved = false;
      rejectReasonText = `المبلغ المطلوب (${formattedAmount}M ج.م) خيالي وفلكي ويتجاوز السقف التاريخي لخزينة النادي! مجلس الإدارة يرفض بالإجماع المغامرة بسلامة النادي المالية، ويشترط صدارة الدوري بدون منازع وبنسبة ثقة تفوق 93%.`;
    }
  } else if (amount > 140000000) {
    if (currentRank <= 2 && Game.boardTrust >= 82) {
      isApproved = true;
    } else {
      isApproved = false;
      rejectReasonText = `طلب صرف (${formattedAmount}M ج.م) هو صفقة كبرى تاريخية، ولا يُمنح إلا لمدرب ينافس بقوة على اللقب (المركز 1 أو 2) وبثقة تفوق 82%. نتائج الفريق الحالية (المركز #${currentRank} وثقة ${Game.boardTrust}%) لا تسمح بهذه المخاطرة.`;
    }
  } else if (amount > 75000000) {
    if (currentRank <= 5 && Game.boardTrust >= 72) {
      isApproved = true;
    } else {
      isApproved = false;
      rejectReasonText = `المبلغ المطلوب (${formattedAmount}M ج.م) كبير جداً. الإدارة تطالبك أولاً بتحسين النتائج ودخول المربع الذهبي (ترتيبك الحالي #${currentRank}) ورفع الثقة إلى 72% قبل الموافقة.`;
    }
  } else if (amount > 35000000) {
    if (currentRank <= 9 && Game.boardTrust >= 62) {
      isApproved = true;
    } else {
      isApproved = false;
      rejectReasonText = `نسبة ثقة الإدارة بك (${Game.boardTrust}%) وترتيب الفريق المتراجع (#${currentRank}) لا يشجعان المجلس على اعتماد ميزانية قدرها (${formattedAmount}M ج.م). ركز على الفوز بالمباريات القادمة أولاً.`;
    }
  } else {
    if (Game.boardTrust >= 52) {
      isApproved = true;
    } else {
      isApproved = false;
      rejectReasonText = `ثقة الإدارة الحالية متدنية (${Game.boardTrust}%) بسبب النتائج السلبية الأخيرة. ارفع من معنويات الفريق وحقق الفوز في الجولة القادمة أولاً.`;
    }
  }

  if (isApproved) {
    // Approved!

// Player chooses to renew and stay with current club for Season N+1
function renewContractAndStartNewSeason() {
  SoundFx.playFanChant();
  Game.season += 1;
  Game.day = 1;
  Game.currentRound = 1;

  // Board allocation for new season
  const seasonalGrant = 100000000; // 100M new season budget boost
  Game.club.budget = (Game.club.budget || 0) + seasonalGrant;
  Game.boardTrust = Math.min(100, Math.max(75, Game.boardTrust + 10));
  Game.teamMorale = 85;

  // Re-generate season league standings and fixtures (Full 38 rounds)
  Game.totalRounds = 38;
  Game.leagueStandings = CLUBS_DATABASE.map(c => ({
    id: c.id,
    name: c.name,
    badge: c.badge,
    played: 0,
    won: 0,
    drawn: 0,
    lost: 0,
    gf: 0,
    ga: 0,
    gd: 0,
    points: 0
  }));

  const otherClubs = CLUBS_DATABASE.filter(c => c.id !== Game.club.id);
  Game.seasonFixtures = [];
  for (let r = 1; r <= 38; r++) {
    const opp = otherClubs[(r - 1) % otherClubs.length];
    Game.seasonFixtures.push({
      round: r,
      day: r * 5,
      home: r % 2 === 1 ? Game.club : opp,
      away: r % 2 === 1 ? opp : Game.club,
      played: false,
      homeScore: null,
      awayScore: null,
      events: []
    });
  }

  // Fresh Champions League Draw for the new season
  initChampionsLeagueState(Game.club.id);

  // Refresh Transfer Market with new prospects
  Game.transferMarket = [];
  otherClubs.forEach(club => {
    const p1 = generatePlayer(club.id, 'ST', club.reputation + 2);
    const p2 = generatePlayer(club.id, 'CM', club.reputation + 1);
    const p3 = generatePlayer(club.id, 'CB', club.reputation);
    Game.transferMarket.push(p1, p2, p3);
  });

  // Add Board Letter in Inbox
  Game.inbox.unshift({
    id: `msg_renew_s${Game.season}`,

    senderRole: 'رئيس النادي',
    senderAvatar: '🏛️',

    date: `الموسم ${Game.season} - يوم 1`,
    read: false,
    type: 'board'
  });

  Game.newsFeed.unshift({
    title: `✍️ رسميًا: المدرب ${Game.manager.name} يجدد عقده مع ${Game.club.name} للموسم ${Game.season}`,

/* =========================================================================
   CANVAS FIREWORKS CELEBRATION
   ========================================================================= */

function startFireworks() {
  const canvas = document.getElementById('celebration-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = [];
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.5) * 12,
      color: ['#00F2FE', '#1E60FF', '#F59E0B', '#10B981'][Math.floor(Math.random() * 4)],
      alpha: 1
    });
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.015;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
    if (particles.some(p => p.alpha > 0)) {
      requestAnimationFrame(render);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  render();
}

        ${list.map(msg => `
          <div class="inbox-item ${!msg.read ? 'unread' : ''}" onclick="openInboxMessageModal('${msg.id}')">
            <div class="inbox-avatar">${msg.senderAvatar || '👤'}</div>
            <div style="flex:1; min-width:0;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
                <div style="font-weight:800; font-size:12px; color:#fff;">
                  ${msg.senderName} <span style="font-size:10px; color:var(--text-muted); font-weight:normal;">(${msg.senderRole || 'عضو الفريق'})</span>
                </div>
                <div style="font-size:10px; color:var(--text-dim);">${msg.date || 'اليوم'}</div>
              </div>
              <div style="font-weight:700; font-size:12px; color:var(--accent-gold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${msg.subject}
              </div>
              <div style="font-size:11px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;">
                ${msg.body}
              </div>
            </div>
            ${!msg.read ? `<div style="width:8px; height:8px; border-radius:50%; background:#EF4444; margin-right:4px;"></div>` : ''}
          </div>
        `).join('')}
      </div>
    `}
  `;
  openModal();
}

function openInboxMessageModal(msgId) {
  SoundFx.playClick();
  const msg = (Game.inbox || []).find(m => m.id === msgId);
  if (!msg) return;

  msg.read = true;
  saveGameToStorage();
  updateTopHeader();

  const modalBody = document.getElementById('modal-body');
  modalBody.innerHTML = `
    <div class="animate-fadeIn">
      <!-- Message Header -->
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; border-bottom:1px solid var(--border-card); padding-bottom:10px;">
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="font-size:32px;">${msg.senderAvatar || '👤'}</div>
          <div>
            <div style="font-size:14px; font-weight:900; color:#fff;">${msg.senderName}</div>
            <div style="font-size:11px; color:var(--accent-cyan);">${msg.senderRole || 'مرسل'} • ${msg.date}</div>
          </div>
        </div>
        <button class="btn btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="openInboxModal()">
          ⬅️ العودة للبريد
        </button>
      </div>

      <!-- Subject -->
      <div style="font-size:14px; font-weight:800; color:var(--accent-gold); margin-bottom:10px;">
        ${msg.subject}
      </div>

      <!-- Message Content Body -->
      <div style="background:rgba(255,255,255,0.03); border:1px solid var(--border-card); border-radius:10px; padding:14px; font-size:12px; line-height:1.8; color:#fff; margin-bottom:14px;">
        ${msg.body}
      </div>

      <!-- Interactive Decision Choices (If available) -->
      ${msg.choices && msg.choices.length > 0 && !msg.responded ? `
        <div style="margin-top:12px;">
          <label style="font-size:11px; color:var(--accent-cyan); font-weight:800; display:block; margin-bottom:8px;">
            🗣️ ردك وقرارك الفني كمدير للفريق:
          </label>
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${msg.choices.map((c, idx) => `
              <button class="press-option-btn" onclick="respondToInboxMessage('${msg.id}', ${idx})">
                ${c.text}
                ${c.effectLabel ? `<div style="font-size:10px; color:#34D399; margin-top:2px;">${c.effectLabel}</div>` : ''}
              </button>
            `).join('')}
          </div>
        </div>
      ` : (msg.responded ? `
        <div style="background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.3); border-radius:8px; padding:8px 12px; font-size:11px; color:#34D399; margin-bottom:12px;">
          ✅ تم إرسال ردك على هذه الرسالة: "<b>${msg.selectedResponseText || 'تم اتخاذ القرار'}</b>"
        </div>
      ` : '')}

      <!-- Transfer Action button if linked to transfer offer -->
      ${msg.type === 'offer' && msg.offerId ? `
        <div class="grid-2" style="margin-top:10px;">
          <button class="btn btn-accent btn-lg" onclick="closeModal(); switchView('transfers');">
            💼 الانتقال لغرفة العروض في الميركاتو
          </button>
          <button class="btn btn-secondary btn-lg" onclick="deleteInboxMessage('${msg.id}')">
            🗑️ مسح الإشعار
          </button>
        </div>
      ` : `
        <div style="display:flex; justify-content:space-between; margin-top:14px;">
          <button class="btn btn-secondary" onclick="deleteInboxMessage('${msg.id}')">
            🗑️ حذف الرسالة
          </button>
          <button class="btn btn-accent" onclick="openInboxModal()">
            📬 جميع الرسائل
          </button>
        </div>
      `}
    </div>
  `;
  openModal();
}

function respondToInboxMessage(msgId, choiceIdx) {
  SoundFx.playClick();
  const msg = (Game.inbox || []).find(m => m.id === msgId);
  if (!msg || !msg.choices || !msg.choices[choiceIdx]) return;

  const choice = msg.choices[choiceIdx];
  msg.responded = true;
  msg.selectedResponseText = choice.text;

  // Execute choice action callback if provided
  if (choice.action) {
    choice.action();
  }

  saveGameToStorage();
  updateTopHeader();
  openInboxMessageModal(msgId);
}

function deleteInboxMessage(msgId) {
  SoundFx.playClick();
  Game.inbox = (Game.inbox || []).filter(m => m.id !== msgId);
  saveGameToStorage();
  updateTopHeader();
  openInboxModal();
}

/* =========================================================================
   CHECK & TRIGGER PLAYER UNREST / SQUAD INBOX DRAMA
   ========================================================================= */

function checkAndTriggerPlayerInboxEvents() {
  if (!Game.inbox) Game.inbox = [];
  if (!Game.transferOffers) Game.transferOffers = [];

  const benchPlayers = Game.squad.filter(p => !p.isStarter);

  // 1. Player Demanding Playtime (أنا عايز ألعب أساسي)
  const unhappyBenchStar = benchPlayers.find(p => p.ovr >= 74 && (!p.lastBenchMsgDay || Game.day - p.lastBenchMsgDay >= 6));
  if (unhappyBenchStar && Math.random() < 0.7) {
    unhappyBenchStar.lastBenchMsgDay = Game.day;
    unhappyBenchStar.morale = Math.max(20, unhappyBenchStar.morale - 10);

    const msgId = `msg_bench_${unhappyBenchStar.id}_${Game.day}`;
    Game.inbox.unshift({
      id: msgId,
      senderName: unhappyBenchStar.name,
      senderRole: `لاعب (${unhappyBenchStar.pos} - ⭐${unhappyBenchStar.ovr})`,
      senderAvatar: '⚠️',
      subject: `⚠️ طلب اجتماع عاجل: عدم مشاركتي في التشكيل الأساسي`,
      body: `كابتن ${Game.manager.name}، أنا أمتلك إمكانيات فنية كبيرة (تقييم ⭐${unhappyBenchStar.ovr})، ووجودي المستمر على دكة البدلاء أمر لا يرضيني ويضر بمسيرتي. أريد أن ألعب أساسياً وإلا سأضطر لاتخاذ خطوات للرحيل عن النادي!`,
      date: `يوم ${Game.day}`,
      read: false,
      type: 'player',
      choices: [
        {
          text: '🤝 «أعدك بالمشاركة أساسياً في المباريات القادمة»',
          effectLabel: '(+15 معنويات اللاعب والالتزام بإشراكه)',
          action: () => {
            unhappyBenchStar.promisedStart = true;
            unhappyBenchStar.morale = Math.min(100, unhappyBenchStar.morale + 20);
          }
        },
        {
          text: '👔 «المشاركة تُكتسب بالاجتهاد في التدريبات ومصلحة الفريق فوق الجميع»',
          effectLabel: '(حزم تكتيكي + هدوء غرفة الملابس)',
          action: () => {
            unhappyBenchStar.morale = Math.max(30, unhappyBenchStar.morale - 5);
          }
        },
        {
          text: '🚪 «إذا لم يعجبك قراري الفني، يمكنك طلب الرحيل وسأعرضك للبيع»',
          effectLabel: '(طلب رحيل رسمي وفتح باب الانتقال)',
          action: () => {
            unhappyBenchStar.requestedTransfer = true;
            unhappyBenchStar.morale = Math.max(10, unhappyBenchStar.morale - 25);
            Game.newsFeed.unshift({
              title: `🚨 توتر في غرفة الملابس: ${unhappyBenchStar.name} يطلب الرحيل رسميًا عن ${Game.club.name}`,
              time: `يوم ${Game.day}`,
              type: 'world'
            });
          }
        }
      ]
    });
  }

  // 2. Transfer Request from Unhappy or Demanding Player (سيبوني أمشي)
  const transferDemander = Game.squad.find(p => p.requestedTransfer && (!p.lastLeaveMsgDay || Game.day - p.lastLeaveMsgDay >= 8));
  if (transferDemander && Math.random() < 0.6) {
    transferDemander.lastLeaveMsgDay = Game.day;
    const msgId = `msg_leave_${transferDemander.id}_${Game.day}`;
    Game.inbox.unshift({
      id: msgId,
      senderName: transferDemander.name,
      senderRole: `لاعب (${transferDemander.pos})`,
      senderAvatar: '🚪',
      subject: `🚪 طلب رسمي: سيبوني أمشي من الفريق وخوض تجربة جديدة`,
      body: `كابتن، طموحاتي الحالية لم تعد تتماشى مع النادي وتلقيت اتصالات من أندية منافسة. أرجو من الإدارة والجهاز الفني التكرم بالموافقة على بيعي في أقرب فرصة و(سيبوني أمشي).`,
      date: `يوم ${Game.day}`,
      read: false,
      type: 'player',
      choices: [
        {
          text: '🛑 «أنت عنصر أساسي ولن أسمح برحيلك مهما كلف الأمر»',
          effectLabel: '(رفض قاطع للرحيل والتمسك باللاعب)',
          action: () => {
            transferDemander.requestedTransfer = false;
            transferDemander.morale = Math.max(40, transferDemander.morale - 10);
          }
        },
        {
          text: '💼 «سأعرضك للبيع إذا وصلنا عرض مالي كبير يليق بالنادي»',
          effectLabel: '(إدراجه في سوق البيع واستقبال عروض الأندية)',
          action: () => {
            transferDemander.listedForTransfer = true;
            generateIncomingOfferForPlayer(transferDemander);
          }
        },
        {
          text: '💰 «سنزيد راتبك بنسبة 30% لتجديد عقدك وإبقائك نجماً معنا»',
          effectLabel: '(+30% راتب + استعادة المعنويات)',
          action: () => {
            transferDemander.requestedTransfer = false;
            transferDemander.wage = Math.round(transferDemander.wage * 1.3);
            transferDemander.morale = 95;
          }
        }
      ]
    });
  }

  // 3. Incoming Transfer Offers from AI Clubs
  const targetForOffer = Game.squad.find(p => p.listedForTransfer || p.requestedTransfer) || 
                         Game.squad[Math.floor(Math.random() * Game.squad.length)];
  if (targetForOffer && Math.random() < 0.4 && (Game.transferOffers || []).length < 4) {
    generateIncomingOfferForPlayer(targetForOffer);
  }

  saveGameToStorage();
  updateTopHeader();
}

function generateIncomingOfferForPlayer(player) {
  const otherClubs = CLUBS_DATABASE.filter(c => c.id !== Game.club.id);
  const buyerClub = otherClubs[Math.floor(Math.random() * otherClubs.length)];
  const offerAmount = Math.round(player.value * (0.9 + Math.random() * 0.4));
  const offerId = `offer_${player.id}_${Date.now()}`;

  const offerObj = {
    id: offerId,
    playerId: player.id,
    buyerClubId: buyerClub.id,
    amount: offerAmount,
    date: `يوم ${Game.day}`
  };

  Game.transferOffers.unshift(offerObj);

  // Send official memo to inbox
  Game.inbox.unshift({
    id: `msg_offer_${offerId}`,
    senderName: buyerClub.name,
    senderRole: 'إدارة التعاقدات والمفاوضات',
    senderAvatar: buyerClub.badge,
    subject: `💼 عرض شراء رسمي لـ ${player.name} مقابل ${(offerAmount/1000000).toFixed(1)}M ج.م`,
    body: `إلى إدارة نادي ${Game.club.name} المحترمة، نتقدم بطلب شراء رسمي لضم اللاعب ${player.name} (${player.pos} - تقييم ⭐${player.ovr}) بمقابل مالي قدره ${(offerAmount/1000000).toFixed(1)} مليون جنيه مصري. يرجى التكرم بالرد على العرض بالقبول أو طلب التفاوض.`,
    date: `يوم ${Game.day}`,
    read: false,
    type: 'offer',
    offerId: offerId,
    choices: [
      {
        text: `✅ قبول العرض وبيع اللاعب فوراً (+${(offerAmount/1000000).toFixed(1)}M ج.م)`,
        effectLabel: '(إتمام البيع وتحصيل المقابل المالي)',
        action: () => {
          acceptTransferOffer(offerId);
        }
      },
      {
        text: '🔄 الدخول في مفاوضات وطلب زيادة السعر (+25%)',
        effectLabel: '(طاولة المفاوضات لرفع السعر)',
        action: () => {
          openOfferNegotiationModal(offerId);
        }
      },
      {
        text: '❌ رفض العرض تماماً والتمسك باللاعب',
        effectLabel: '(إلغاء العرض وإشعار النادي)',
        action: () => {
          rejectTransferOffer(offerId);
        }
      }
    ]
  });
}

/* =========================================================================
   MODAL CONTROLLERS & EXPORT
   ========================================================================= */

function openModal() {
  document.getElementById('app-modal').classList.add('active');
}

function closeModal() {
  SoundFx.playClick();
  document.getElementById('app-modal').classList.remove('active');
}

function openPlayerDetailModal(playerId) {
  const p = Game.squad.find(x => x.id === playerId);
  if (!p) return;
  const isListed = p.listedForTransfer || p.requestedTransfer;
  const isInjured = (p.injuryMatches || 0) > 0;

  if (!p.skills || !Array.isArray(p.skills) || p.skills.length === 0) {
    p.skills = generatePlayerSkills(p.pos, p.ovr, p.edition);
  }

  const modalBody = document.getElementById('modal-body');
  modalBody.innerHTML = `

      <div style="width:48px; height:48px; border-radius:12px; background:rgba(255,255,255,0.06); border:2px solid var(--accent-cyan); display:flex; align-items:center; justify-content:center; font-size:28px;">
        ${p.pos === 'GK' ? '🧤' : (p.pos.includes('B') ? '🛡️' : (p.pos.includes('M') ? '🪄' : '⚽'))}

    </div>

      ${isInjured ? `<span class="injury-badge">${p.injuryType || '🩹 مصاب'} (متبقي ${p.injuryMatches} جولات)</span>` : '<span class="status-pill" style="background:rgba(52,211,153,0.15); color:#34D399;">💚 سليم وجاهز 100%</span>'}
      ${p.isSuspended ? '<span class="status-pill" style="background:rgba(239,68,68,0.2); color:#EF4444;">🟥 موقوف بسبب البطاقات</span>' : ''}

      ${p.listedForTransfer ? '<span class="status-pill" style="background:rgba(245,158,11,0.2); color:#F59E0B;">💼 معروض للبيع</span>' : ''}
    </div>

    <!-- Special Skills & Traits -->
    <div style="margin-bottom:12px; background:rgba(255,255,255,0.02); border:1px solid var(--border-card); border-radius:8px; padding:10px;">
      <div style="font-size:11px; font-weight:800; color:var(--accent-gold); margin-bottom:6px;">✨ المهارات الخاصة والسمات (Player Skills & Traits):</div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        ${(p.skills || []).map(s => `<span class="skill-pill" style="font-size:11px; padding:4px 8px;">${s}</span>`).join('')}
      </div>
    </div>

    <!-- Core Attributes Grid -->
    <div class="grid-4" style="margin-bottom:12px;">
      <div style="background:rgba(255,255,255,0.03); border:1px solid var(--border-card); padding:6px; border-radius:8px; text-align:center;">
        <div style="font-size:10px; color:var(--text-muted);">السرعة</div>
        <div style="font-size:15px; font-weight:900; color:var(--accent-cyan);">${p.pac}</div>
      </div>
      <div style="background:rgba(255,255,255,0.03); border:1px solid var(--border-card); padding:6px; border-radius:8px; text-align:center;">
        <div style="font-size:10px; color:var(--text-muted);">التسديد</div>

    <!-- Injury Action if applicable -->
    ${isInjured ? `
      <div style="margin-bottom:12px;">
        <button class="btn btn-accent" style="width:100%; font-size:12px; font-weight:800;" onclick="closeModal(); treatSinglePlayer('${p.id}');">
          🩺 علاج وتأهيل فوري في المركز الطبي (500,000 ج.م)
        </button>
      </div>
    ` : ''}

    <div class="grid-2">
      <button class="btn ${isListed ? 'btn-secondary' : 'btn-gold'}" onclick="togglePlayerTransferList('${p.id}'); closeModal();">
        ${isListed ? '❌ إلغاء العرض للبيع' : '📯 عرض اللاعب للبيع'}
      </button>
      <button class="btn btn-secondary" onclick="closeModal()">
        إغلاق
      </button>
    </div>
  `;
  openModal();
}

function autoPickBestEleven() {
  SoundFx.playClick();
  Game.squad.sort((a, b) => b.ovr - a.ovr);
  Game.squad.forEach((p, i) => {
    p.isStarter = (i < 11);
  });
  saveGameToStorage();
  switchView('squad');
}

function exportSaveFile() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(Game));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `VORSA_SAVE_${Game.manager.name}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function confirmResetCareer() {
  if (confirm("هل أنت متأكد من رغبتك في حذف المسيرة الحالية والبدء من جديد؟")) {
    localStorage.removeItem('VORSA_CAREER_SAVE');
    location.reload();
  }
}

// Initial Boot with resilient fallback
function bootVorsaGame() {
  try {
    setupNetworkListeners();
  } catch (e) {
    console.warn('setupNetworkListeners warning:', e);
  }
  try {
    loadOnlineProfile();
  } catch (e) {
    console.warn('loadOnlineProfile warning:', e);
  }

  try {
    const hasSave = loadGameFromStorage();
    if (!hasSave || !Game.club || !Game.manager || !Game.manager.name) {
      switchView('onboarding');
    } else {
      updateTopHeader();
      switchView('mode_select');
    }
  } catch (err) {
    console.error('Fatal boot error, falling back to onboarding:', err);
    switchView('onboarding');
  }
}

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', bootVorsaGame);
} else {
  bootVorsaGame();
}
</script>
